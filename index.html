<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Autoklicker Weiterleitung</title>
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
        <script>
        window.onload = function() {
            // Speichern der Benutzerinteraktion im lokalen Speicher
            localStorage.setItem('userInteracted', 'true');
            // Simuliert einen Klick nach 1 Sekunde
            setTimeout(function() {
                window.location.href = "https://camoflush.github.io/The-Domain-of-the-Duelist/intro.html";
            }, 2000); // 1000 Millisekunden = 1 Sekunde
        }
    </script>
</body>
</html>
