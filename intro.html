<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>intro</title>
    <link rel="stylesheet" href="intro.css">
    <link rel="preload" href="hieroglyphicspanel.png" as="image">
</head>
<body>
<div id="intro" class="intro">
    <video autoplay muted id="introVideo">
        <source src="./Intro/intro_logo.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <audio id="backgroundMusic" loop>
        <source src="./Intro/intro_musik.mp3" type="audio/mp3">
        Your browser does not support the audio tag.
    </audio>
</div>
<script>
    window.onload = function() {
        const video = document.getElementById('introVideo');
        const audio = document.getElementById('backgroundMusic');
        
        // Überprüfen, ob die Benutzerinteraktion stattgefunden hat
        if (localStorage.getItem('userInteracted')) {
            audio.volume = 0.2; // Setze die Lautstärke auf 20%
            audio.play();
        }

        video.onended = function() {
            video.pause();
            video.classList.add('static');
            canClick = true;
        };

        let canClick = false;
        document.addEventListener('click', function() {
            if (canClick) {
                video.classList.add('fade-out');
                // Musik leiser werden lassen und gleichzeitig weiterleiten
                let fadeAudio = setInterval(function() {
                    if (audio.volume > 0) {
                        audio.volume -= 0.05;
                    } else {
                        clearInterval(fadeAudio);
                        audio.pause();
                    }
                }, 100); // Reduziert die Lautstärke alle 100 Millisekunden

                setTimeout(function() {
                    window.location.href = "https://github.com/Camoflush/The-Domain-of-the-Duelist/main/Deckbuilder.html";
                }, 2000); // Wartezeit für das Verblassen und Weiterleitung
            }
        });

        document.addEventListener('keydown', function() {
            if (canClick) {
                video.classList.add('fade-out');
                // Musik leiser werden lassen und gleichzeitig weiterleiten
                let fadeAudio = setInterval(function() {
                    if (audio.volume > 0) {
                        audio.volume -= 0.05;
                    } else {
                        clearInterval(fadeAudio);
                        audio.pause();
                    }
                }, 100); // Reduziert die Lautstärke alle 100 Millisekunden

                setTimeout(function() {
                    window.location.href = "https://github.com/Camoflush/The-Domain-of-the-Duelist/main/Deckbuilder.html";
                }, 2000); // Wartezeit für das Verblassen und Weiterleitung
            }
        });
    }
</script>
</body>
</html>
